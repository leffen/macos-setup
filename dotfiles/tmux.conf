# ~/.tmux.conf — managed by macos-setup
#
# The prefix is left as C-b on purpose. Remapping to C-a is the common advice
# and it is wrong here: C-a is "beginning of line" in every zsh prompt on this
# machine, and stealing it makes every shell subtly worse to fix one keystroke.

# ── Colour ────────────────────────────────────────────────────
# Without both of these, tmux flattens truecolour to 256 and the Vesper palette
# renders as approximations -- which reads as "my theme is broken in tmux".
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc,xterm-kitty:Tc"

# ── Sane defaults ─────────────────────────────────────────────
set -g mouse on
set -g history-limit 100000
set -g base-index 1              # windows from 1: 0 is a long reach
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10            # 500ms default makes vim's Esc feel broken
set -g focus-events on
set -g set-clipboard on

# ── Splits that remember where you were ───────────────────────
# The defaults (% and ") are unmemorable and open in ~, not the current dir.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload without leaving the session.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ── Copy mode: vi keys, and copy to the macOS clipboard ───────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ── Status line (Vesper) ──────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=#101010,fg=#a0a0a0"
set -g status-left "#[fg=#aca1cf,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=#7e7e7e]#{?client_prefix,#[fg=#ea83a5]PREFIX ,}#[fg=#90b99f]#h "
setw -g window-status-current-style "fg=#ffc799,bold"
setw -g window-status-style "fg=#7e7e7e"
set -g pane-border-style "fg=#7e7e7e"
set -g pane-active-border-style "fg=#aca1cf"
set -g message-style "bg=#101010,fg=#e6b99d"
