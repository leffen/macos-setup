# ~/.config/kitty/kitty.conf — managed by macos-setup
#
# Deliberately mirrors dotfiles/ghostty-config: same font, same Vesper palette,
# same cursor and scrollback. Switching terminals should change the software,
# not the way the screen looks -- otherwise comparing them tells you which
# theme you prefer rather than which terminal you prefer.
#
# The palette below is copied from Ghostty's own bundled theme file
# (Ghostty.app/Contents/Resources/ghostty/themes/Vesper) so the two cannot
# drift apart by transcription error.

# ── Font ──────────────────────────────────────────────────────
font_family      Geist Mono
font_size        14.0
# Ghostty sets -calt -liga -dlig; this is kitty's equivalent. Programming
# ligatures off on purpose: `!=` should look like two characters.
disable_ligatures always
# Ghostty's adjust-cell-height = 10%
modify_font      cell_height 110%

# ── Colours (Vesper) ──────────────────────────────────────────
background            #101010
foreground            #ffffff
cursor                #acb1ab
cursor_text_color     #ffffff
selection_background  #988049
selection_foreground  #b9beb8

color0  #101010
color1  #f5a191
color2  #90b99f
color3  #e6b99d
color4  #aca1cf
color5  #e29eca
color6  #ea83a5
color7  #a0a0a0
color8  #7e7e7e
color9  #ff8080
color10 #99ffe4
color11 #ffc799
color12 #b9aeda
color13 #ecaad6
color14 #f591b2
color15 #ffffff

# ── Window ────────────────────────────────────────────────────
window_padding_width      8 10
hide_window_decorations   titlebar-only
macos_titlebar_color      background
confirm_os_window_close   0
remember_window_size      yes

# ── Cursor & scrollback ───────────────────────────────────────
cursor_shape          block
cursor_blink_interval 0
scrollback_lines      100000
mouse_hide_wait       2.0

# ── Selection & clipboard ─────────────────────────────────────
copy_on_select        clipboard
strip_trailing_spaces smart

# ── macOS ─────────────────────────────────────────────────────
# Norwegian layout: Option composes | @ \ { } [ ] $ -- Option-7 is the pipe.
# Option is NOT remapped to Meta here. The trade is real but one-sided on this
# machine: Meta buys Alt-b/Alt-f word motion, and there is not a single bindkey
# line in the zsh config, while losing composition costs characters needed in
# every shell command. When it was on, the symptom was not "a setting is wrong"
# but "the pipe key stopped working", which is far harder to trace back.
macos_option_as_alt   no
macos_quit_when_last_window_closed no

# ── Shell integration ─────────────────────────────────────────
shell_integration enabled
term xterm-kitty
